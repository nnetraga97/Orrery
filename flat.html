<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Orrery — flat reference view</title>
    <style>
      html, body { height: 100%; margin: 0; background: #070b14; color: #dfe7ff; font: 13px system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; overflow: hidden; }
      #stage canvas { display: block; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      #labels > div { position: absolute; white-space: nowrap; text-shadow: 0 1px 3px #000; transform: translate(-50%, -100%); }
      #labels > div.label-centered { transform: translate(-50%, -50%); }
      #hud { position: fixed; left: 12px; top: 12px; max-width: 360px; background: #0c1220cc; padding: 8px 10px; border-radius: 6px; }
      #legendExtra, #trackpadHelp, #mouseHelp { display: none; }
      #hud [hidden] { display: none; }
      #hud .ui-icon { width: 16px; height: 16px; vertical-align: middle; }
      #info { margin: 6px 0 0; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="stage" aria-busy="false">
      <div id="labels"></div>
    </div>
    <div id="hud">
      <strong>Flat reference view</strong> <span id="sceneFps">— FPS</span>
      <div id="sceneError" hidden><span></span> <button type="button">Reload view</button></div>
      <div id="busy" hidden><span id="sceneLoadingTitle"></span> <span id="sceneLoadingDetail"></span></div>
      <button id="trafficBtn" type="button"></button>
      <label><span id="orbitLabel"></span> <input id="speed" type="range" min="0" max="3" step="0.1" value="1" /></label>
      <section id="cameraOptions" hidden>
        <select id="cameraInputDevice"><option value="trackpad">Trackpad</option><option value="mouse">Mouse</option></select>
        <select id="cameraDragMode"><option value="orbit">Orbit</option><option value="pan">Pan</option></select>
        <button id="cameraHome" type="button">Fit view</button>
        <button id="cameraFocus" type="button">Focus selected</button>
        <button id="cameraZoomIn" type="button">Zoom in</button>
        <button id="cameraZoomOut" type="button">Zoom out</button>
        <p id="trackpadHelp">Two-finger swipe pans. Pinch zooms.</p>
        <p id="mouseHelp" hidden>Scroll to zoom. Shift-scroll pans.</p>
      </section>
      <div id="extra"></div>
      <div id="legendExtra"></div>
      <pre id="info"></pre>
    </div>
    <script type="module" src="/src/flat/main.js"></script>
  </body>
</html>
